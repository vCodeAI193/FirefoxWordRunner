<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Runner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.svg" alt="" class="logo" aria-hidden="true">
    <h1>Word Runner</h1>
  </header>

  <main>
    <!-- Text Source -->
    <section class="source-section" aria-labelledby="source-label">
      <p id="source-label" class="section-label" data-i18n="textSourceLabel"></p>
      <div class="radio-group" role="radiogroup" aria-labelledby="source-label">
        <label class="radio-label">
          <input type="radio" name="source" value="selection" id="radio-selection">
          <span class="radio-custom"></span>
          <span data-i18n="selectedText"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="source" value="page" id="radio-page" checked>
          <span class="radio-custom"></span>
          <span data-i18n="fullPage"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="source" value="custom" id="radio-custom">
          <span class="radio-custom"></span>
          <span data-i18n="customText"></span>
        </label>
      </div>
      <div id="custom-text-section" class="custom-text-section hidden">
        <label for="custom-text" class="sr-only" data-i18n="customText"></label>
        <textarea id="custom-text" rows="4" data-i18n-placeholder="customTextPlaceholder"></textarea>
        <button id="clipboard-paste-btn" class="rl-btn" type="button" data-i18n="clipboardPaste"></button>
      </div>
    </section>

    <!-- Reading Speed -->
    <section class="speed-section" aria-labelledby="speed-label">
      <div class="speed-header">
        <label for="wpm-slider" id="speed-label" class="section-label" data-i18n="readingSpeedLabel"></label>
        <output id="wpm-display" for="wpm-slider">300</output>
        <span class="wpm-unit">WPM</span>
      </div>
      <input type="range" id="wpm-slider"
             min="100" max="1000" step="25" value="300"
             aria-valuemin="100" aria-valuemax="1000" aria-valuenow="300">
      <div class="speed-labels" aria-hidden="true">
        <span data-i18n="slowLabel"></span>
        <span data-i18n="fastLabel"></span>
      </div>
      <div class="preset-btns" role="group" aria-label="Speed presets">
        <button class="preset-btn" type="button" data-wpm="150" data-i18n="presetSlow"></button>
        <button class="preset-btn" type="button" data-wpm="300" data-i18n="presetNormal"></button>
        <button class="preset-btn" type="button" data-wpm="500" data-i18n="presetFast"></button>
        <button class="preset-btn" type="button" data-wpm="750" data-i18n="presetExpert"></button>
      </div>
    </section>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar hidden" role="status" aria-live="polite"></div>

    <!-- Word count preview -->
    <p id="word-count-preview" class="word-count-preview hidden" aria-live="polite"></p>

    <!-- Start button -->
    <button id="start-btn" class="start-btn" type="button" data-i18n="startReading"></button>

    <!-- Advanced settings -->
    <details class="collapsible-section" id="advanced-details">
      <summary class="collapsible-summary" data-i18n="advancedLabel"></summary>
      <div class="collapsible-content">

        <!-- Display mode -->
        <div class="setting-row">
          <span id="display-mode-label" class="setting-label" data-i18n="displayModeLabel"></span>
          <div class="toggle-group" role="radiogroup" aria-labelledby="display-mode-label">
            <label class="toggle-label">
              <input type="radio" name="displayMode" value="overlay" id="radio-overlay" checked>
              <span data-i18n="overlayMode"></span>
            </label>
            <label class="toggle-label">
              <input type="radio" name="displayMode" value="highlight" id="radio-highlight">
              <span data-i18n="highlightMode"></span>
            </label>
          </div>
        </div>

        <!-- Overlay position (only show if overlay mode) -->
        <div class="setting-row" id="overlay-position-row">
          <span id="overlay-pos-label" class="setting-label" data-i18n="overlayPositionLabel"></span>
          <div class="toggle-group" role="radiogroup" aria-labelledby="overlay-pos-label">
            <label class="toggle-label"><input type="radio" name="overlayPosition" value="top-left"> <span data-i18n="posTopLeft"></span></label>
            <label class="toggle-label"><input type="radio" name="overlayPosition" value="top-center"> <span data-i18n="posTopCenter"></span></label>
            <label class="toggle-label"><input type="radio" name="overlayPosition" value="center" checked> <span data-i18n="posCenter"></span></label>
            <label class="toggle-label"><input type="radio" name="overlayPosition" value="bottom-center"> <span data-i18n="posBottomCenter"></span></label>
            <label class="toggle-label"><input type="radio" name="overlayPosition" value="bottom-right"> <span data-i18n="posBottomRight"></span></label>
          </div>
        </div>

        <!-- Words per chunk -->
        <div class="setting-row">
          <span id="words-chunk-label" class="setting-label" data-i18n="wordsPerChunkLabel"></span>
          <div class="toggle-group" role="radiogroup" aria-labelledby="words-chunk-label">
            <label class="toggle-label">
              <input type="radio" name="wordsPerChunk" value="1" id="radio-one-word" checked>
              <span data-i18n="oneWord"></span>
            </label>
            <label class="toggle-label">
              <input type="radio" name="wordsPerChunk" value="2" id="radio-two-words">
              <span data-i18n="twoWords"></span>
            </label>
          </div>
        </div>

        <!-- Font size -->
        <div class="setting-row setting-row--col">
          <div class="setting-row-header">
            <label for="font-size-slider" class="setting-label" data-i18n="fontSizeLabel"></label>
            <output id="font-size-display" for="font-size-slider">48</output>
            <span class="wpm-unit">px</span>
          </div>
          <input type="range" id="font-size-slider" min="24" max="96" step="4" value="48"
                 aria-valuemin="24" aria-valuemax="96" aria-valuenow="48">
        </div>

        <!-- Font family -->
        <div class="setting-row">
          <label for="font-family-select" class="setting-label" data-i18n="fontFamilyLabel"></label>
          <select id="font-family-select" class="select-input">
            <option value="system" data-i18n="fontSystem"></option>
            <option value="serif"  data-i18n="fontSerif"></option>
            <option value="mono"   data-i18n="fontMono"></option>
          </select>
        </div>

        <!-- Theme -->
        <div class="setting-row">
          <label for="theme-select" class="setting-label" data-i18n="themeLabel"></label>
          <select id="theme-select" class="select-input">
            <option value="auto"  data-i18n="themeAuto"></option>
            <option value="dark"  data-i18n="themeDark"></option>
            <option value="light" data-i18n="themeLight"></option>
          </select>
        </div>

        <!-- Overlay Background Color (only in overlay mode) -->
        <div class="setting-row" id="overlay-bg-color-row">
          <label for="overlay-bg-color" class="setting-label" data-i18n="overlayBgColorLabel"></label>
          <input type="color" id="overlay-bg-color" value="#0a0a19" class="color-input">
        </div>

        <!-- ORP Color -->
        <div class="setting-row">
          <label for="orp-color" class="setting-label" data-i18n="orpColorLabel"></label>
          <input type="color" id="orp-color" value="#ef5350" class="color-input">
        </div>

        <!-- Skip short words -->
        <div class="setting-row">
          <label class="checkbox-label">
            <input type="checkbox" id="skip-short-words">
            <span class="checkbox-custom"></span>
            <span data-i18n="skipShortWordsLabel"></span>
          </label>
        </div>

        <!-- Auto-pause at sentence end -->
        <div class="setting-row">
          <label class="checkbox-label">
            <input type="checkbox" id="pause-at-sentence">
            <span class="checkbox-custom"></span>
            <span data-i18n="pauseAtSentenceLabel"></span>
          </label>
        </div>

        <!-- Dim page (spotlight in highlight mode) -->
        <div class="setting-row">
          <label class="checkbox-label">
            <input type="checkbox" id="dim-page">
            <span class="checkbox-custom"></span>
            <span data-i18n="dimPageLabel"></span>
          </label>
        </div>

        <!-- Bionic reading -->
        <div class="setting-row">
          <label class="checkbox-label">
            <input type="checkbox" id="bionic-reading">
            <span class="checkbox-custom"></span>
            <span data-i18n="bionicReadingLabel"></span>
          </label>
        </div>

        <!-- Pause multipliers -->
        <div class="setting-row setting-row--col">
          <div class="setting-row-header">
            <label for="sentence-pause-slider" class="setting-label" data-i18n="sentencePauseLabel"></label>
            <output id="sentence-pause-display" for="sentence-pause-slider">0.6</output>
            <span class="wpm-unit">×</span>
          </div>
          <input type="range" id="sentence-pause-slider" min="0" max="1.5" step="0.1" value="0.6"
                 aria-valuemin="0" aria-valuemax="1.5" aria-valuenow="0.6">
        </div>
        <div class="setting-row setting-row--col">
          <div class="setting-row-header">
            <label for="comma-pause-slider" class="setting-label" data-i18n="commaPauseLabel"></label>
            <output id="comma-pause-display" for="comma-pause-slider">0.3</output>
            <span class="wpm-unit">×</span>
          </div>
          <input type="range" id="comma-pause-slider" min="0" max="0.8" step="0.1" value="0.3"
                 aria-valuemin="0" aria-valuemax="0.8" aria-valuenow="0.3">
        </div>
        <div class="setting-row setting-row--col">
          <div class="setting-row-header">
            <label for="paragraph-pause-slider" class="setting-label" data-i18n="paragraphPauseLabel"></label>
            <output id="paragraph-pause-display" for="paragraph-pause-slider">2.5</output>
            <span class="wpm-unit">×</span>
          </div>
          <input type="range" id="paragraph-pause-slider" min="1.0" max="5.0" step="0.5" value="2.5"
                 aria-valuemin="1.0" aria-valuemax="5.0" aria-valuenow="2.5">
        </div>

        <!-- Content extraction mode -->
        <div class="setting-row">
          <label for="content-mode-select" class="setting-label" data-i18n="contentModeLabel"></label>
          <select id="content-mode-select" class="select-input">
            <option value="smart"   data-i18n="contentModeSmart"></option>
            <option value="article" data-i18n="contentModeArticle"></option>
            <option value="minimal" data-i18n="contentModeMinimal"></option>
          </select>
        </div>

        <!-- Daily goal -->
        <div class="setting-row">
          <label for="daily-goal-input" class="setting-label" data-i18n="dailyGoalLabel"></label>
          <input type="number" id="daily-goal-input" min="0" max="50000" step="100" value="0" class="number-input">
          <span class="wpm-unit" data-i18n="wordsLabel"></span>
        </div>

        <!-- Export / Import settings -->
        <div class="setting-row setting-row--btns">
          <button id="export-settings-btn" class="rl-btn" type="button" data-i18n="exportSettings"></button>
          <button id="import-settings-btn" class="rl-btn" type="button" data-i18n="importSettings"></button>
          <input type="file" id="import-settings-file" accept=".json" style="display:none">
        </div>

      </div>
    </details>

    <!-- Reading List -->
    <details class="collapsible-section" id="reading-list-details">
      <summary class="collapsible-summary" data-i18n="readingListLabel"></summary>
      <ul id="reading-list-items" class="reading-list-items" role="list"></ul>
      <button id="add-to-list-btn" class="add-btn" type="button" data-i18n="addToListLabel"></button>
    </details>

    <!-- Statistics -->
    <details class="collapsible-section" id="stats-details">
      <summary class="collapsible-summary" data-i18n="statsLabel"></summary>
      <p id="stats-content" class="stats-content"></p>
      <div class="setting-row--btns" style="margin-top:6px;display:flex;gap:6px;">
        <button id="export-stats-btn" class="rl-btn" type="button" data-i18n="exportStatsCsv"></button>
        <button id="clear-stats-btn" class="rl-btn" type="button" data-i18n="clearStats"></button>
      </div>
    </details>

    <!-- Keyboard Shortcuts -->
    <details class="collapsible-section" id="shortcuts-details">
      <summary class="collapsible-summary" data-i18n="shortcutsLabel"></summary>
      <ul class="shortcuts-list" aria-label="Keyboard shortcuts">
        <li><span data-i18n="shortcutStartStop"></span></li>
        <li><span data-i18n="shortcutPause"></span></li>
        <li><span data-i18n="shortcutEsc"></span></li>
        <li><span data-i18n="shortcutSkip"></span></li>
        <li><span data-i18n="shortcutSpeed"></span></li>
      </ul>
    </details>

    <!-- Bookmarks for current tab -->
    <div id="tab-bookmarks" class="hidden"></div>

    <!-- Key Bindings -->
    <details class="collapsible-section" id="keymap-details">
      <summary class="collapsible-summary" data-i18n="keymapLabel"></summary>
      <div class="collapsible-content">
        <div class="keymap-row"><span data-i18n="keymapPause"></span><button class="keymap-btn" type="button" data-action="pause">Space</button></div>
        <div class="keymap-row"><span data-i18n="keymapStop"></span><button class="keymap-btn" type="button" data-action="stop">Escape</button></div>
        <div class="keymap-row"><span data-i18n="keymapSkipFwd"></span><button class="keymap-btn" type="button" data-action="skipFwd">ArrowRight</button></div>
        <div class="keymap-row"><span data-i18n="keymapSkipBwd"></span><button class="keymap-btn" type="button" data-action="skipBwd">ArrowLeft</button></div>
        <div class="keymap-row"><span data-i18n="keymapSpeedUp"></span><button class="keymap-btn" type="button" data-action="speedUp">Equal</button></div>
        <div class="keymap-row"><span data-i18n="keymapSpeedDn"></span><button class="keymap-btn" type="button" data-action="speedDn">Minus</button></div>
        <button id="keymap-reset-btn" class="rl-btn" type="button" data-i18n="keymapReset"></button>
      </div>
    </details>

  </main>

  <script src="lib/validators.js"></script>
  <script src="popup.js"></script>
</body>
</html>
